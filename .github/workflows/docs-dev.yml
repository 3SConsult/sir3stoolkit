name: Development docs

# Every push to main: build the docs of the current development state and deploy them to
# https://3sconsult.github.io/sir3stoolkit/dev/ (gh-pages branch, folder dev/ - nothing else on
# gh-pages is touched). The release docs at the root are deployed by release.yml.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    # release.yml deploys to gh-pages too - never let both push at the same time.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip and install project with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,sphinx,mantle]

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Generate rst files with sphinx-apidoc
        run: sphinx-apidoc -o docs/source/references src/sir3stoolkit

      # docs_channel=dev shows the "Development version" banner (docs/source/_templates/layout.html).
      - name: Build Sphinx documentation
        run: sphinx-build -b html -A docs_channel=dev docs/source docs/build/html

      - name: Deploy to gh-pages/dev/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
          publish_branch: gh-pages
          destination_dir: dev
