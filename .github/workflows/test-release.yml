name: Test release

# Manual run only (Actions tab -> Test release -> Run workflow, choose the branch): a test release before
# the real one (release.yml, pushing the tag v<version>).
#   1. build   - builds the package with the version of pyproject.toml plus .dev<run number> (e.g.
#                90.15.27.dev3) and uploads it to TestPyPI only. Its own version number, because TestPyPI
#                accepts each version only once - the real release uploads 90.15.27 there, too.
#   2. tutorials (optional) - packs the tutorial archives and attaches them to the GitHub pre-release
#                v<version> (e.g. v90.15.27.dev3), so `python -m sir3stoolkit tutorials` of the test version
#                finds them. A pre-release is not shown as the latest release; the tag it creates does not
#                trigger release.yml (tags created with the workflow's GITHUB_TOKEN start no workflows).
#                Delete it after testing: gh release delete v<version> --cleanup-tag
#
# Install the test version in a fresh virtual environment (dependencies come from PyPI):
#   pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ sir3stoolkit==<version>

on:
  workflow_dispatch:
    inputs:
      tutorials:
        description: 'Also attach the tutorials to a GitHub pre-release v<version> (for testing python -m sir3stoolkit tutorials)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set the test version (pyproject.toml version + .dev<run number>)
        id: version
        shell: bash
        run: |
          BASE=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          VERSION="$BASE.dev${{ github.run_number }}"
          sed -i "s/^version = \"$BASE\"/version = \"$VERSION\"/" pyproject.toml
          grep -q "^version = \"$VERSION\"" pyproject.toml || { echo "::error::Could not set version $VERSION in pyproject.toml"; exit 1; }
          echo "Test version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build tools and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install .[dev]

      - name: Lint with flake8 (errors only)
        shell: bash
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --extend-exclude=docs

      # Without version: the packaged guide keeps its links to main (a test version has no tag of its own
      # unless the tutorials pre-release is created).
      - name: Sync AGENTS.md into the package
        uses: ./.github/actions/sync-agents-md

      - name: Build package using pyproject.toml
        run: python -m build

      - name: Publish to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.MF3S_TEST_PYPI_TOKEN }}
        run: twine upload --repository-url https://test.pypi.org/legacy/ dist/*

      - name: How to install it
        shell: bash
        run: |
          echo "### Test version ${{ steps.version.outputs.version }} on TestPyPI" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ sir3stoolkit==${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  tutorials:
    needs: build
    if: ${{ inputs.tutorials }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pack the tutorial archives
        run: python docs/source/tutorials/prepare_tutorials.py --no-build --zip-dir tutorial_archives

      - name: Attach them to the GitHub pre-release v<version>
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" tutorial_archives/*.zip --prerelease --target "${{ github.sha }}" \
            --title "Test release ${TAG#v}" \
            --notes "Test release ${TAG#v} (TestPyPI only), to test python -m sir3stoolkit tutorials before the release. Delete after testing: gh release delete $TAG --cleanup-tag"
