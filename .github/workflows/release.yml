name: Release

# Push of a version tag (e.g. v90.15.27) on a commit of main:
#   1. verify  - the tag matches the version in pyproject.toml and its commit is on main
#   2. publish - build the package and upload it to TestPyPI and PyPI
#   3. docs    - build the docs from the tag and deploy them to https://3sconsult.github.io/sir3stoolkit/
#                (gh-pages root; the development docs in dev/ are kept). Only runs if publishing worked,
#                so the release docs are never ahead of PyPI.
#
# Manual run (Actions tab -> Release -> Run workflow): verify + docs only, never uploads to PyPI.
#   ref = main     - documentation hotfix right after a release: deploys the docs fixed on main as
#                    release docs, as long as src/ and pyproject.toml are unchanged since the release tag
#                    (the tag of the version in pyproject.toml). Otherwise make a new release instead.
#   ref = v<x.y.z> - rebuilds the release docs of a tag, e.g. of a tag on a commit that predates this
#                    workflow (a tag push runs the workflow file of the tagged commit, so it doesn't
#                    trigger this workflow).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'main (docs hotfix after a release) or an existing release tag (e.g. v90.15.26). Does not publish to PyPI.'
        required: true
        default: main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check out the commit to release (full history and tags, for the checks below)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check version, tag and main
        id: check
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="v$VERSION"
          if [ "$EVENT" = "push" ] && [ "$PUSHED_TAG" != "$TAG" ]; then
            echo "::error::Tag $PUSHED_TAG does not match the version in pyproject.toml ($VERSION) - expected tag $TAG."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::This commit is not on main. Releases are only made from main."
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
              echo "::error::pyproject.toml has version $VERSION, but there is no tag $TAG - release it by pushing the tag instead."
              exit 1
            fi
            if ! git diff --quiet "$TAG" HEAD -- src pyproject.toml; then
              echo "::error::src/ or pyproject.toml changed since $TAG - the release docs would describe unreleased code. Make a new release instead. Changed files:"
              git diff --name-only "$TAG" HEAD -- src pyproject.toml
              exit 1
            fi
            echo "Docs-only release build: code unchanged since $TAG."
          fi
          echo "Version $VERSION ($TAG) verified."
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install .[dev]

      - name: Lint with flake8
        shell: bash  # bash stops at the first failing command; pwsh (Windows default) only checks the last one
        run: |
          # stop the build if there are Python syntax errors or undefined names
          # (docs/ excluded: its code snippets are excerpts that use names defined elsewhere, e.g. s3s)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --extend-exclude=docs
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Sync AGENTS.md into the package (shipped in the wheel via package-data, links pointed at this release's tag)
        uses: ./.github/actions/sync-agents-md
        with:
          version: ${{ needs.verify.outputs.version }}

      - name: Build package using pyproject.toml
        run: python -m build

      - name: Publish to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.MF3S_TEST_PYPI_TOKEN }}
        run: twine upload --repository-url https://test.pypi.org/legacy/ dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.MF3S_PYPI_TOKEN }}
        run: twine upload --repository-url https://upload.pypi.org/legacy/ dist/*

  docs:
    needs: [verify, publish]
    # publish is skipped on manual runs - run anyway then, but never after a failed upload
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.publish.result != 'failure' }}
    runs-on: ubuntu-latest
    # docs-dev.yml deploys to gh-pages too - never let both push at the same time.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip and install project with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,sphinx,mantle]

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Generate rst files with sphinx-apidoc
        run: sphinx-apidoc -o docs/source/references src/sir3stoolkit

      # docs_channel=release shows the "Released version" banner (docs/source/_templates/layout.html).
      - name: Build Sphinx documentation
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: sphinx-build -b html -A docs_channel=release -A "docs_version=$VERSION" docs/source docs/build/html

      # The root deploy replaces everything on gh-pages - carry the current dev/ docs over into it.
      - name: Check out the current dev/ folder of gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _gh_pages
          sparse-checkout: dev

      - name: Carry dev/ over into the release build
        run: |
          if [ -d _gh_pages/dev ]; then
            cp -r _gh_pages/dev docs/build/html/dev
          else
            echo "gh-pages has no dev/ folder yet - nothing to carry over."
          fi

      - name: Deploy to the gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
          publish_branch: gh-pages
